# C++ のライブラリと Python のパッケージのリリース(docs/adr/0056)。
#
# - タグ v<バージョン> の push: ビルドと検証の後、PyPI に wheel・sdist を出し、GitHub の Release を作って zip・wheel・sdist を添える。
# - 手で実行(workflow_dispatch): ビルドと検証の後、TestPyPI に出す(本番の前の確かめ。Release は作らない)。
#
# PyPI・TestPyPI へは Trusted Publishing で出す(トークンを置かない)。環境 pypi・testpypi に承認者を設定しておくと、
# 公開の前で止まり、承認を待つ。デザイナーの vsix はここでは出さない(手で出す)。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ビルドの前に、タグ・CMakeLists.txt・py/pyproject.toml のバージョンと CHANGELOG.md の節が揃っているかを確かめる。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: バージョンを確かめる
        id: version
        run: |
          VERSION="$(sed -n 's/^project(beth VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)"
          PY_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' py/pyproject.toml)"
          if [ "$VERSION" != "$PY_VERSION" ]; then
            echo "::error::CMakeLists.txt($VERSION)と py/pyproject.toml($PY_VERSION)のバージョンが違います"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::タグ $GITHUB_REF_NAME が CMakeLists.txt のバージョン $VERSION と違います"; exit 1
          fi
          if ! grep -q "^## \[$VERSION\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md に $VERSION の節(日付つき)がありません"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release の本文を CHANGELOG.md から作る
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 該当する節の本文(次の「## [」の前まで)。相対リンク(docs/…)は、タグの版のファイルを指すリンクにする。
          awk -v v="## [$VERSION]" 'index($0, v) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md \
            | sed "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/#g" > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml

  pypi:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_type == 'tag' && 'pypi' || 'testpypi' }}
      url: ${{ github.ref_type == 'tag' && 'https://pypi.org/p/bethany-lcl' || 'https://test.pypi.org/p/bethany-lcl' }}
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Python の配布物だけを集める
        run: |
          mkdir python-dist
          mv dist/*.whl dist/*.tar.gz python-dist/
          ls -l python-dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist
          repository-url: ${{ github.ref_type == 'tag' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  github-release:
    if: github.ref_type == 'tag'
    needs: [prepare, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: GitHub の Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v$VERSION" --notes-file artifacts/release-notes/release-notes.md \
            artifacts/dist/*.zip artifacts/dist/*.whl artifacts/dist/*.tar.gz
